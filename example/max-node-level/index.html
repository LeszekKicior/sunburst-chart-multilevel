<head>
  <script src="../../dist/sunburst-chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    .info {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: 380px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      line-height: 1.4;
    }

    .info b {
      display: inline-block;
      min-width: 90px;
    }
  </style>
</head>
<body>
  <div class="info">
    <div><b>level values:</b> 10, 20, 50, 100</div>
    <div><b>maxNodeLevel:</b> 60</div>
    <div>The chart should only display nodes where <i>level</i> is lower than 60. In this case, nodes with level 100 are hidden.</div>
  </div>
  <div id="chart"></div>

  <script>
    const data = {
      name: 'Root',
      level: 10,
      color: '#3366cc',
      children: [
        {
          name: 'Level 20 A',
          level: 20,
          color: '#dc3912',
          children: [
            {
              name: 'Level 50 A1',
              level: 50,
              color: '#ff9900',
              children: [
                { name: 'Level 100 A1a', level: 100, color: '#109618', value: 4 },
                { name: 'Level 100 A1b', level: 100, color: '#990099', value: 3 }
              ]
            },
            {
              name: 'Level 50 A2',
              level: 50,
              color: '#0099c6',
              value: 5
            }
          ]
        },
        {
          name: 'Level 20 B',
          level: 20,
          color: '#dd4477',
          children: [
            {
              name: 'Level 50 B1',
              level: 50,
              color: '#66aa00',
              children: [
                { name: 'Level 100 B1a', level: 100, color: '#b82e2e', value: 2 },
                { name: 'Level 100 B1b', level: 100, color: '#316395', value: 2 }
              ]
            }
          ]
        }
      ]
    };

    new Sunburst(document.getElementById('chart'))
      .data(data)
      .level('level')
      .size('value')
      .color('color')
      .maxNodeLevel(60)
      .transitionDuration(750)
      .tooltipContent((d, node) => `Raw level: <i>${d.level}</i><br>Value: <i>${node.value}</i>`);
  </script>
</body>
